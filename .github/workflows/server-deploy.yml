# License / client-card server (Cloudflare Worker + D1): test, apply new D1 migrations, deploy.
# Runs on a push to main that touches the server or the card page, or by hand (Actions → Run).
# Repository secrets: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit + D1:Edit), CLOUDFLARE_ACCOUNT_ID.
name: server-deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'branding/report/client-card.html'
      - '.github/workflows/server-deploy.yml'
concurrency: server-deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply xems-license --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check
        run: curl -fsS https://license.biocode-bg.com/health
