# License / client-card server (Cloudflare Worker + D1): test, apply new D1 migrations, deploy.
# Runs on a push to main that touches the server or the card page, or by hand (Actions → Run).
# Repository secrets: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit + D1:Edit), CLOUDFLARE_ACCOUNT_ID;
# GEMINI_API_KEY (the AI coach, /v1/ai/brief) is copied into the Worker's secret of the same name on every deploy.
name: server-deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'branding/report/client-card.html'
      - 'branding/certificate/index.html'
      - '.github/workflows/server-deploy.yml'
concurrency: server-deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply xems-license --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Gemini key → the Worker's secret (the AI coach)
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY
          else echo "no GEMINI_API_KEY secret in GitHub — the AI coach answers offline"; fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check
        run: curl -fsS https://license.biocode-bg.com/health
      - name: Check — the AI coach answers (a bad token is refused before the model; 400/401 = the route is up)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://license.biocode-bg.com/v1/ai/brief \
            -H 'Content-Type: application/json' -d '{"text":"x"}')
          echo "ai/brief → $code"; test "$code" != 404
