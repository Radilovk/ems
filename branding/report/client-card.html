<title>XEMS Картон</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07080C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;500;700;800&family=Onest:wght@400;500;600&display=swap">
<style>
/* One deliberate look (dark glass over a moving glow), the same on any host background. */
:root{color-scheme:dark;
  --bg:#07080C;--glass:rgba(255,255,255,.045);--glass2:rgba(255,255,255,.07);--edge:rgba(255,255,255,.09);
  --text:#F2F4F8;--muted:rgba(242,244,248,.56);--faint:rgba(242,244,248,.32);
  --c1:#7C5CFF;--c2:#22D3EE;--c3:#A3E635;--c4:#FBBF24;--c5:#FF3D6E;
  --f-disp:"Geologica","Roboto Condensed",system-ui,sans-serif;--f-body:"Onest",Roboto,system-ui,sans-serif}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);font:15px/1.45 var(--f-body);padding-inline:16px;padding-block:14px 40px;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden;min-height:100%}
*{box-sizing:border-box}
.aura{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(60px);opacity:.75}
.aura i{position:absolute;border-radius:50%;mix-blend-mode:screen}
.aura i:nth-child(1){width:55vmax;height:55vmax;left:-8%;top:-12%;background:radial-gradient(circle,rgba(124,92,255,.55),transparent 65%);animation:a1 18s ease-in-out infinite alternate}
.aura i:nth-child(2){width:50vmax;height:50vmax;right:-14%;top:18%;background:radial-gradient(circle,rgba(255,61,110,.42),transparent 65%);animation:a2 22s ease-in-out infinite alternate}
.aura i:nth-child(3){width:45vmax;height:45vmax;left:10%;bottom:-18%;background:radial-gradient(circle,rgba(34,211,238,.30),transparent 65%);animation:a1 26s ease-in-out infinite alternate-reverse}
@keyframes a1{to{transform:translate(12vw,8vh) scale(1.15)}}
@keyframes a2{to{transform:translate(-10vw,-6vh) scale(.9)}}
.wrap{position:relative;z-index:1;max-width:480px;margin:0 auto;display:grid;gap:14px}
.num{font-family:var(--f-disp);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.glass{background:linear-gradient(160deg,var(--glass2),var(--glass) 60%);border:1px solid var(--edge);border-radius:28px;
  -webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 20px 50px rgba(0,0,0,.35)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--c2);outline-offset:3px;border-radius:12px}

.top{display:flex;justify-content:space-between;align-items:center;padding:4px 2px}
.brand{display:flex;align-items:center;gap:8px;font:800 13px var(--f-disp);letter-spacing:.22em}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--c5);box-shadow:0 0 10px var(--c5),0 0 22px var(--c5)}
.ico{all:unset;position:relative;cursor:pointer;width:40px;height:40px;display:grid;place-items:center;border-radius:50%}
.ico svg{width:18px;height:18px}

.hero{padding:6px 4px 4px;display:grid;gap:10px}
.hero h1{margin:0;font:800 clamp(44px,14vw,64px)/.92 var(--f-disp);letter-spacing:-.045em;
  background:linear-gradient(180deg,#fff 30%,rgba(255,255,255,.55));-webkit-background-clip:text;background-clip:text;color:transparent}
.flame{justify-self:start;display:inline-flex;align-items:center;gap:7px;padding:7px 13px 7px 10px;border-radius:999px;font:600 13px var(--f-body)}
.flame svg{width:16px;height:16px}

/* rings */
.rings{display:grid;grid-template-columns:132px minmax(0,1fr);gap:18px;align-items:center;padding:18px}
.rings svg{width:132px;height:132px;overflow:visible}
.ring-bg{fill:none;stroke:rgba(255,255,255,.07)}
.ring{fill:none;stroke-linecap:round;transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1)}
.rl{display:grid;gap:12px}
.rl div{display:grid;gap:1px}
.rl small{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:7px}
.rl small i{width:8px;height:8px;border-radius:50%}
.rl b{font:700 22px/1.1 var(--f-disp);letter-spacing:-.02em}
.rl b span{font-weight:300;color:var(--faint)}

/* body */
.bodyc{padding:14px 14px 16px;display:grid;gap:12px;justify-items:center;overflow:hidden}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--edge)}
.seg button{all:unset;cursor:pointer;padding:7px 16px;border-radius:999px;font:500 13px var(--f-body);color:var(--muted);transition:background .25s,color .25s}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.14);color:var(--text)}
.stage{position:relative;width:min(100%,260px);touch-action:pan-y;user-select:none}
.stage canvas{display:block;width:100%;height:auto;transition:opacity .45s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
.stage canvas+canvas{position:absolute;inset:0}
.stage canvas.off{opacity:0;transform:scale(.96);pointer-events:none}
.stage.boot canvas{opacity:0;transform:translateY(14px) scale(.97)}
.pick{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--edge);min-height:44px}
.pick i{width:10px;height:10px;border-radius:50%}
.pick b{font:600 15px var(--f-body);white-space:nowrap}
.pick .num{font-size:17px;font-weight:700}
.scale{width:min(100%,300px);height:4px;border-radius:2px;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c4),var(--c5));opacity:.8}

/* numbers */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{padding:16px 10px 14px;display:grid;justify-items:center;gap:2px;border-radius:24px}
.stat .num{font-size:clamp(22px,7vw,30px);font-weight:700}
.stat small{color:var(--muted);font-size:12px}

/* efficiency */
.trend{padding:16px 18px 10px;display:grid;gap:4px}
.trend .h{display:flex;justify-content:space-between;align-items:baseline}
.trend small{color:var(--muted);font-size:12.5px}
.trend .v{display:flex;align-items:baseline;gap:10px}
.trend .v .num{font-size:34px;font-weight:700}
.up{font:600 13px var(--f-body);color:var(--c3)}
.trend svg{width:100%;height:84px;display:block;overflow:visible}

footer{text-align:center;color:var(--faint);font-size:11.5px;padding-top:6px}
.toast{position:fixed;z-index:5;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:10px 18px;border-radius:999px;font:600 13px var(--f-body)}
.rise{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:.001;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){.aura i,.rise{animation:none}.ring,.stage canvas{transition:none}}
@media (max-width:360px){.rings{grid-template-columns:110px minmax(0,1fr)}.rings svg{width:110px;height:110px}}
</style>

<div class="aura" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="wrap">
  <header class="top">
    <div class="brand"><i aria-hidden="true"></i>XEMS</div>
    <button class="ico glass" id="copy" type="button" aria-label="Копирай линка"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg></button>
  </header>

  <div class="hero rise">
    <h1 id="name"></h1>
    <div class="flame glass" id="streak" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="fl" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FF3D6E"/><stop offset="1" stop-color="#FBBF24"/></linearGradient></defs><path fill="url(#fl)" d="M12 2c1 4 5 5.5 5 11a5 5 0 0 1-10 0c0-2.4 1.2-4 2.6-5.2.2 1.7.9 2.8 2 3.4C11.1 8.4 11 5 12 2z"/></svg><span></span></div>
  </div>

  <div class="rings glass rise" style="animation-delay:.08s">
    <svg viewBox="0 0 132 132" id="ringsSvg" aria-hidden="true"></svg>
    <div class="rl" id="ringsTxt"></div>
  </div>

  <div class="bodyc glass rise" style="animation-delay:.16s">
    <div class="seg" role="group" aria-label="Страна"><button type="button" id="sF" aria-pressed="true">Отпред</button><button type="button" id="sB" aria-pressed="false">Отзад</button></div>
    <div class="stage boot" id="stage"><canvas id="cF" aria-label="Отпред"></canvas><canvas id="cB" class="off" aria-label="Отзад"></canvas></div>
    <div class="pick" id="pick" aria-live="polite"></div>
    <div class="scale" aria-hidden="true"></div>
  </div>

  <div class="stats rise" style="animation-delay:.24s">
    <div class="stat glass"><span class="num" id="tN"></span><small id="lN">тренировки</small></div>
    <div class="stat glass"><span class="num" id="tH"></span><small id="lH">часа</small></div>
    <div class="stat glass"><span class="num" id="tK"></span><small>kcal</small></div>
  </div>

  <div class="trend glass rise" id="trend" style="animation-delay:.32s"></div>
  <footer id="foot"></footer>
</div>
<div class="toast glass" id="toast" hidden></div>

<script>
(function(){
"use strict";
let D=null;try{const t=document.getElementById("card-data").textContent.trim();if(t.charAt(0)==="{")D=JSON.parse(t);}catch(e){}
const SAMPLE=!D;if(!D)D=sample();
const EN=D.lang==="en",tr=(bg,en)=>EN?en:bg,$=s=>document.querySelector(s);
const nf=new Intl.NumberFormat(EN?"en-GB":"bg-BG"),fmt=v=>nf.format(Math.round(v)),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const MON=EN?["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]:["яну","фев","мар","апр","май","юни","юли","авг","сеп","окт","ное","дек"];
const CH=EN?["Chest","Abs","Front thigh","Calves","Arms","Traps","Back","Lower back","Glutes","Back thigh"]:["Гърди","Корем","Предно бедро","Прасци","Ръце","Трапец","Гръб","Кръст","Седалище","Задно бедро"];
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
if(EN){document.documentElement.lang="en";$("#sF").textContent="Front";$("#sB").textContent="Back";$("#lN").textContent="trainings";$("#lH").textContent="hours";$("#copy").setAttribute("aria-label","Copy link");}

// colour scale: violet → cyan → lime → amber → hot pink, continuous
const STOPS=[[0,[124,92,255]],[.3,[34,211,238]],[.55,[163,230,53]],[.78,[251,191,36]],[1,[255,61,110]]];
function heat(v){v=clamp(v,0,1);for(let i=1;i<STOPS.length;i++)if(v<=STOPS[i][0]){const a=STOPS[i-1],b=STOPS[i],k=(v-a[0])/(b[0]-a[0]);return a[1].map((x,j)=>Math.round(x+(b[1][j]-x)*k));}return STOPS[4][1];}
const css=c=>`rgb(${c.join(",")})`;
const lv=i=>clamp(D.mus[i]||0,0,1);

// ---- name, streak, numbers
$("#name").textContent=D.name;
if(D.streak>=2){const s=$("#streak");s.hidden=false;s.querySelector("span").textContent=tr(`${D.streak} седмици подред`,`${D.streak} weeks in a row`);}
const hrs=D.sec/3600;
countUp($("#tN"),D.n,0);countUp($("#tK"),D.kcal,0);countUp($("#tH"),hrs,hrs<10?1:0);
function countUp(el,to,dec){const f=v=>dec?v.toFixed(dec).replace(".",EN?".":","):fmt(v);el.textContent=f(to);if(reduce)return;const t0=performance.now()+250,ms=1300;
  const step=t=>{const k=clamp((t-t0)/ms,0,1),e=1-Math.pow(1-k,4);el.textContent=f(to*e);if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}

// ---- rings: next training goal · this week · last efficiency
const MS=[5,10,15,25,40,50,75,100,150,200,300,500];const nx=MS.find(m=>m>D.n)||D.n;const pv=MS[MS.indexOf(nx)-1]||0;
const week=D.weeks[D.weeks.length-1]||0,wkGoal=2,lastE=(D.eff.length?D.eff[D.eff.length-1][1]:0);
const R=[{p:nx>pv?(D.n-pv)/(nx-pv):1,g:["#FF3D6E","#FBBF24"],t:tr("Цел","Goal"),b:`${D.n}<span> / ${nx}</span>`},
         {p:week/wkGoal,g:["#A3E635","#22D3EE"],t:tr("Тази седмица","This week"),b:`${week}<span> / ${wkGoal}</span>`},
         {p:lastE/100,g:["#7C5CFF","#22D3EE"],t:tr("Ефективност","Efficiency"),b:`${lastE}<span>%</span>`}];
(function(){const svg=$("#ringsSvg");let h="<defs>";R.forEach((r,i)=>h+=`<linearGradient id="rg${i}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${r.g[0]}"/><stop offset="1" stop-color="${r.g[1]}"/></linearGradient><filter id="rf${i}" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>`);h+="</defs>";
  R.forEach((r,i)=>{const rad=58-i*17,c=2*Math.PI*rad,p=clamp(r.p,0,1);
    h+=`<circle class="ring-bg" cx="66" cy="66" r="${rad}" stroke-width="12"/>`
      +`<circle class="ring" cx="66" cy="66" r="${rad}" stroke="url(#rg${i})" stroke-width="12" opacity=".55" filter="url(#rf${i})" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-o="${c*(1-p)}" transform="rotate(-90 66 66)"/>`
      +`<circle class="ring" cx="66" cy="66" r="${rad}" stroke="url(#rg${i})" stroke-width="12" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-o="${c*(1-p)}" transform="rotate(-90 66 66)"/>`;});
  svg.innerHTML=h;const go=()=>svg.querySelectorAll(".ring").forEach(e=>e.style.strokeDashoffset=e.dataset.o);reduce?go():setTimeout(go,300);
  $("#ringsTxt").innerHTML=R.map(r=>`<div><small><i style="background:linear-gradient(135deg,${r.g[0]},${r.g[1]})"></i>${r.t}</small><b class="num">${r.b}</b></div>`).join("");})();

// ---- the body: the report's anatomical masks, drawn as dark glass with a light rim and glowing muscles
const sexK=D.sex==="M"&&document.getElementById("fig-male_front")?"male":document.getElementById("fig-female_front")?"female":"male";
const masks={},cache={};let sel=-1,side="front";
// The figures are precomputed muscle-group maps (scripts/gen-card-figures.py): R = zone + 1, +128 on a
// faint line between heads; G = the group's rounded height; B = body coverage.
function mask(key,cb){if(masks[key])return cb(masks[key]);const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=im.width;c.height=im.height;const x=c.getContext("2d");x.drawImage(im,0,0);
  const w=im.width,h=im.height,d=x.getImageData(0,0,w,h).data,N=w*h,lab=new Int8Array(N),gap=new Uint8Array(N),dome=new Float32Array(N),B=new Float32Array(N);
  for(let i=0;i<N;i++){const r=d[i*4];lab[i]=(r&127)-1;gap[i]=r>>7;dome[i]=d[i*4+1]/255;B[i]=d[i*4+2]?1:0;}
  blurF(B,w,h,6,2);const M={w,h,d,lab,gap,dome,bodyH:B};masks[key]=M;cb(M);};im.src=document.getElementById("fig-"+key).textContent.trim();}
// Whole muscle groups: the mask draws the suit zones as many thin strips (fibres). Each zone is
// smoothed with a wide radius and taken where it dominates — the strips merge into one group shape;
// a narrow smoothing keeps only the wide gaps inside a group (between the heads) as a faint line.
// Muscles the suit does not reach are left out: there the body is plain.
function blurF(F,w,h,r,passes){const T=new Float32Array(w*h),n=2*r+1;
  for(let k=0;k<passes;k++){for(let y=0;y<h;y++){let a=0;const o=y*w;for(let x=-r;x<=r;x++)a+=F[o+clamp(x,0,w-1)];for(let x=0;x<w;x++){T[o+x]=a/n;a+=F[o+Math.min(w-1,x+r+1)]-F[o+Math.max(0,x-r)];}}
    for(let x=0;x<w;x++){let a=0;for(let y=-r;y<=r;y++)a+=T[clamp(y,0,h-1)*w+x];for(let y=0;y<h;y++){F[y*w+x]=a/n;a+=T[Math.min(h-1,y+r+1)*w+x]-T[Math.max(0,y-r)*w+x];}}}return F;}
function layers(M,selCh){const w=M.w,h=M.h,d=M.d,lab=M.lab,dome=M.dome,gap=M.gap,BH=M.bodyH;
  const mk=()=>{const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");return[c,x,x.createImageData(w,h)];};
  const[bc,bx,bi]=mk(),[mc,mx,mi]=mk();const b=bi.data,m=mi.data;const cols=CH.map((c,i)=>heat(lv(i)));
  const Al=(x,y)=>(x<0||y<0||x>=w||y>=h)?0:d[(y*w+x)*4+2];
  const Lb=(x,y)=>(x<0||y<0||x>=w||y>=h)?-1:lab[y*w+x];
  const H=(F,x,y)=>F[(y<0?0:y>=h?h-1:y)*w+(x<0?0:x>=w?w-1:x)];
  const Lx=-.5,Ly=-.62,Lz=.6,hx=Lx,hy=Ly,hz=Lz+1,hl=Math.hypot(hx,hy,hz);
  const lit=(F,x,y,s)=>{let nx=-(H(F,x+2,y)-H(F,x-2,y))*s,ny=-(H(F,x,y+2)-H(F,x,y-2))*s,nz=1;const nl=Math.hypot(nx,ny,nz);nx/=nl;ny/=nl;nz/=nl;
    return[Math.max(0,nx*Lx+ny*Ly+nz*Lz),Math.pow(Math.max(0,(nx*hx+ny*hy+nz*hz)/hl),24)];};
  const SKIN=[46,54,72];
  for(let y=0;y<h;y++){const vy=y/h;for(let x=0;x<w;x++){const i=y*w+x,p=i*4,al=d[p+2];if(!al)continue;const z=lab[i];
    // body: one plain surface, softly rounded by its own silhouette
    const[bd,bs]=lit(BH,x,y,5);let f=(.55+.55*bd)*(1.06-.12*vy);let r=SKIN[0]*f+bs*14,g=SKIN[1]*f+bs*14,bl=SKIN[2]*f+bs*14;
    const on=z>=0&&(selCh<0||z===selCh);
    let edge=false;if(z>=0)for(let t=1;t<=2&&!edge;t++)edge=Lb(x-t,y)!==z||Lb(x+t,y)!==z||Lb(x,y-t)!==z||Lb(x,y+t)!==z;
    if(z>=0&&!on){const c=cols[z];r=r*.8+c[0]*.14;g=g*.8+c[1]*.14;bl=bl*.8+c[2]*.14;if(edge){r=r*.7+c[0]*.12;g=g*.7+c[1]*.12;bl=bl*.7+c[2]*.12;}}
    let sil=0;for(let t=1;t<=2;t++)if(!Al(x-t,y)||!Al(x+t,y)||!Al(x,y-t)||!Al(x,y+t)){sil=t===1?1:.5;break;}
    if(sil){const e=.6*sil;r=r*(1-e)+196*e;g=g*(1-e)+210*e;bl=bl*(1-e)+236*e;}
    b[p]=Math.min(255,r);b[p+1]=Math.min(255,g);b[p+2]=Math.min(255,bl);b[p+3]=al;
    // the muscle group: its colour, rounded as one form, faint line between heads, hairline contour
    if(on){const c=cols[z];const[md,ms]=lit(dome,x,y,3);const L=(.84+.2*md)*(gap[i]?.91:1);let mr=c[0]*L+ms*12,mg=c[1]*L+ms*12,mb=c[2]*L+ms*12;
      if(edge){mr=mr*.5+(c[0]*.6+100)*.5;mg=mg*.5+(c[1]*.6+100)*.5;mb=mb*.5+(c[2]*.6+100)*.5;}
      m[p]=Math.min(255,mr);m[p+1]=Math.min(255,mg);m[p+2]=Math.min(255,mb);m[p+3]=al;}}}
  bx.putImageData(bi,0,0);mx.putImageData(mi,0,0);return[bc,mc];}
function stepDown(src,W,H){let c=src;while(c.width/2>=W*1.05){const n=document.createElement("canvas");n.width=Math.round(c.width/2);n.height=Math.round(c.height/2);const x=n.getContext("2d");x.imageSmoothingQuality="high";x.drawImage(c,0,0,n.width,n.height);c=n;}
  const o=document.createElement("canvas");o.width=W;o.height=H;const x=o.getContext("2d");x.imageSmoothingQuality="high";x.drawImage(c,0,0,W,H);return o;}
function paint(canvas,key){mask(key,M=>{const dpr=Math.min(3,devicePixelRatio||1),W=Math.round((canvas.parentNode.clientWidth||280)*dpr),H=Math.round(W*M.h/M.w),ck=key+"|"+sel+"|"+W;
  if(canvas._ck===ck)return;
  if(!cache[ck]){const[body,mus]=layers(M,sel);const B=stepDown(body,W,H),Mu=stepDown(mus,W,H);
    const o=document.createElement("canvas");o.width=W;o.height=H;const x=o.getContext("2d");
    x.drawImage(B,0,0);
    x.save();x.globalCompositeOperation="lighter";x.filter=`blur(${Math.round(W/18)}px)`;x.globalAlpha=.42;x.drawImage(Mu,0,0);x.filter=`blur(${Math.round(W/70)}px)`;x.globalAlpha=.75;x.drawImage(Mu,0,0);x.restore();
    x.drawImage(Mu,0,0);cache[ck]=o;}
  const c=cache[ck];if(canvas.width!==W||canvas.height!==H){canvas.width=W;canvas.height=H;}const x=canvas.getContext("2d");x.clearRect(0,0,W,H);x.drawImage(c,0,0);canvas._ck=ck;canvas._m=M;});}
let raf=0;const draw=()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;paint($("#cF"),sexK+"_front");paint($("#cB"),sexK+"_back");label();});};
const top=CH.map((c,i)=>i).sort((a,b)=>lv(b)-lv(a))[0];
function label(){const i=sel>=0?sel:top;$("#pick").innerHTML=`<i style="background:${css(heat(lv(i)))};box-shadow:0 0 12px ${css(heat(lv(i)))}"></i><b>${CH[i]}</b><span class="num">${Math.round(lv(i)*100)}%</span>`;}
function at(canvas,e){const M=canvas._m;if(!M)return -1;const r=canvas.getBoundingClientRect();const X=Math.floor((e.clientX-r.left)/r.width*M.w),Y=Math.floor((e.clientY-r.top)/r.height*M.h);if(X<0||Y<0||X>=M.w||Y>=M.h)return -1;if(M.lab)return M.lab[Y*M.w+X];const k=M.d[(Y*M.w+X)*4];return k>=1&&k<=10?k-1:-1;}
function setSide(s){side=s;$("#cF").classList.toggle("off",s!=="front");$("#cB").classList.toggle("off",s!=="back");$("#sF").setAttribute("aria-pressed",String(s==="front"));$("#sB").setAttribute("aria-pressed",String(s==="back"));}
$("#sF").onclick=()=>setSide("front");$("#sB").onclick=()=>setSide("back");
const stage=$("#stage");let sx=null,sy=0;
stage.addEventListener("pointerdown",e=>{sx=e.clientX;sy=e.clientY;});
stage.addEventListener("pointerup",e=>{if(sx==null)return;const dx=e.clientX-sx,dy=e.clientY-sy;sx=null;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){setSide(side==="front"?"back":"front");return;}
  const c=side==="front"?$("#cF"):$("#cB");const ch=at(c,e);sel=ch===sel?-1:ch;draw();});
draw();setTimeout(()=>stage.classList.remove("boot"),150);
addEventListener("resize",()=>{for(const k in cache)delete cache[k];$("#cF")._ck=$("#cB")._ck="";draw();});

// ---- efficiency over the trainings
const E=D.eff.map(x=>x[1]),avg=a=>a.reduce((q,v)=>q+v,0)/Math.max(1,a.length);
if(E.length>=2){const k=Math.max(1,Math.min(3,Math.floor(E.length/2))),dv=Math.round(avg(E.slice(-k))-avg(E.slice(0,k)));
  const W=300,H=84,lo=Math.min(...E)-6,hi=Math.max(...E)+4,X=i=>i*(W/(E.length-1)),Y=v=>H-6-(v-lo)/(hi-lo)*(H-18);
  const pts=E.map((v,i)=>[X(i),Y(v)]);let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;d+=` C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`;}
  const last=pts[pts.length-1];
  $("#trend").innerHTML=`<div class="h"><small>${tr("Ефективност по тренировки","Efficiency by training")}</small>${dv>0?`<span class="up">▲ ${dv}</span>`:""}</div>
   <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="tl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C5CFF"/><stop offset=".6" stop-color="#22D3EE"/><stop offset="1" stop-color="#A3E635"/></linearGradient>
   <linearGradient id="ta" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22D3EE" stop-opacity=".28"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient><filter id="tg"><feGaussianBlur stdDeviation="3"/></filter></defs>
   <path d="${d} L${W},${H} L0,${H}Z" fill="url(#ta)"/><path d="${d}" fill="none" stroke="url(#tl)" stroke-width="5" opacity=".5" filter="url(#tg)"/><path d="${d}" fill="none" stroke="url(#tl)" stroke-width="2.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
   <circle cx="${last[0]}" cy="${last[1]}" r="5" fill="#A3E635" style="filter:drop-shadow(0 0 6px #A3E635)"/></svg>`;}
else $("#trend").hidden=true;

const g=new Date(D.gen);$("#foot").textContent=(SAMPLE?tr("Примерни данни · ","Sample data · "):"")+tr("обновено ","updated ")+g.getDate()+" "+MON[g.getMonth()];

// ---- copy the link
const toast=t=>{const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>e.hidden=true,2000);};
if(!/^https?:/.test(location.href))$("#copy").hidden=true;
$("#copy").onclick=()=>{const u=location.href.split("#")[0];try{navigator.clipboard.writeText(u).then(()=>toast(tr("Линкът е копиран","Link copied")),()=>toast(u));}catch(e){toast(u);}};

function sample(){const now=Date.now(),dd=864e5,eff=[];for(let i=0;i<14;i++)eff.push([now-(50-i*3.6)*dd,Math.round(69+i*1.0+(i%4===2?-5:0))]);
  return{v:1,lang:/[?&]en\b/.test(location.search)?"en":"bg",name:"Мария",sex:"F",gen:now,since:now-80*dd,n:22,sec:31944,act:30800,kcal:3213,contr:0,
    weeks:[2,2,1,2,2,1,2,2,2,2,2,1],streak:12,eff,mus:[.78,.85,1,.67,.52,.61,.81,.57,.95,.9],last:{d:now,t:"",e:83,k:164,a:1404,h:115}};}
})();
