<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XEMS Движение</title>
<!-- Test bench for the XEMS Motion module (docs/xems-motion.md): five XIAO nRF52840 Sense sensors over Web Bluetooth
     (Chrome on the tablet / a laptop), or the built-in simulated person ("Демо"). Live figure, angles, speed, reps.
     All math is in motion-core.js (same file the offline test runs). Open over https or file:// in Chrome. -->
<style>
:root { --bg:#f4f5f7; --card:#fff; --ink:#15181d; --mute:#667085; --line:#e3e6ea; --acc:#0a84ff; --l:#ff3b30; --r:#30b14c;
  --warn:#ff9f0a; --ok:#30b14c; --floor:#d9dde3; --bone:#3a4250; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0f1115; --card:#191c22; --ink:#eef0f3;
  --mute:#9aa3af; --line:#2a2f37; --floor:#262b33; --bone:#c9d0da; } }
:root[data-theme="dark"] { --bg:#0f1115; --card:#191c22; --ink:#eef0f3; --mute:#9aa3af; --line:#2a2f37; --floor:#262b33; --bone:#c9d0da; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { display:grid; grid-template-columns:250px 1fr 270px; gap:12px; padding:12px 16px; height:100vh; overflow:hidden; }
@media (max-width: 820px) { body { grid-template-columns:1fr; height:auto; overflow:auto; } #stage { height:60vh; } }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; }
.col { display:flex; flex-direction:column; gap:12px; min-height:0; }
h1 { font-size:17px; margin:0 0 2px; } .sub { color:var(--mute); font-size:13px; }
button { font:inherit; border:0; border-radius:11px; padding:11px 14px; background:var(--line); color:var(--ink); cursor:pointer;
  transition:transform .08s, filter .15s; } button:active { transform:scale(.97); } button:disabled { opacity:.45; }
button.main { background:var(--acc); color:#fff; font-weight:600; font-size:16px; }
.row { display:flex; gap:8px; } .row > * { flex:1; }
#sensors { display:flex; flex-direction:column; gap:6px; overflow:auto; }
.sens { display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:10px; background:var(--bg); font-size:13px; }
.dot { width:12px; height:12px; border-radius:50%; flex:none; background:var(--mute); }
.sens b { font-weight:600; } .sens .m { color:var(--mute); margin-left:auto; white-space:nowrap; }
#stage { position:relative; min-height:0; padding:0; overflow:hidden; }
canvas { width:100%; height:100%; display:block; touch-action:none; }
#hint { position:absolute; left:12px; bottom:10px; color:var(--mute); font-size:12px; }
#view { position:absolute; right:10px; top:10px; display:flex; gap:6px; } #view button { padding:6px 10px; font-size:13px; }
#reps { text-align:center; } #reps .n { font-size:64px; font-weight:700; line-height:1; } #reps .k { color:var(--mute); }
#reps .ph { display:inline-block; margin-top:6px; padding:3px 10px; border-radius:20px; background:var(--bg); font-size:13px; }
table { width:100%; border-collapse:collapse; font-size:13px; } td { padding:3px 2px; border-bottom:1px solid var(--line); }
td.v { text-align:right; font-variant-numeric:tabular-nums; font-weight:600; } td.l { color:var(--l); } td.r { color:var(--r); }
#angles { overflow:auto; min-height:0; flex:1; }
#wiz { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:5; }
#wiz .box { background:var(--card); border-radius:18px; padding:22px 26px; width:min(640px, 92vw); display:flex; gap:20px; align-items:center; }
#wiz .big { font-size:56px; font-weight:700; min-width:80px; text-align:center; color:var(--acc); }
#wiz h2 { margin:0 0 6px; font-size:20px; } #wiz p { margin:0; color:var(--mute); }
#wiz .res { margin-top:10px; font-size:14px; } .bad { color:var(--warn); }
</style>
</head>
<body>
<div class="col">
  <div class="card"><h1>XEMS Движение</h1><div class="sub">5 сензора → поза, ъгли, скорост, повторения</div></div>
  <div class="card col" style="flex:1; min-height:0">
    <div class="row"><button id="add">＋ Сензор</button><button id="demo">Демо</button></div>
    <div id="sensors"></div>
    <button id="cal" class="main" disabled>Калибрирай</button>
    <div class="row"><button id="rec" disabled>● Запис</button><button id="theme">◐</button></div>
    <div class="sub" id="note">Сложи сензорите с долната страна към тялото: китките като часовник, подбедриците от външната страна над глезена, гърба между лопатките.</div>
  </div>
</div>
<div class="card" id="stage"><canvas id="cv"></canvas>
  <div id="view"><button data-v="front">Отпред</button><button data-v="side">Отстрани</button><button data-v="free">3D</button></div>
  <div id="hint">Влачи за завъртане</div></div>
<div class="col">
  <div class="card" id="reps"><div class="n" id="rn">0</div><div class="k" id="rk">повторения</div><div class="ph" id="rp">в покой</div></div>
  <div class="card" id="angles"><table id="tbl"></table></div>
</div>
<div id="wiz"><div class="box"><div class="big" id="wn">1</div><div><h2 id="wt"></h2><p id="wp"></p><div class="res" id="wr"></div>
  <div class="row" style="margin-top:12px"><button id="wcancel">Отказ</button><button id="wok" class="main" style="display:none">Готово</button></div></div></div></div>
<script src="motion-core.js"></script>
<script>
'use strict';
const X = XemsMotion, $ = (id) => document.getElementById(id);
const DATA_SVC = '6e400101-b5a3-f393-e0a9-e50e24dcca9e', DATA_CHR = '6e400102-b5a3-f393-e0a9-e50e24dcca9e';
const NUS = '6e400001-b5a3-f393-e0a9-e50e24dcca9e', NUS_RX = '6e400002-b5a3-f393-e0a9-e50e24dcca9e', NUS_TX = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';
const sensors = {};             // id → { name, dev, rx, last, bat, n, rate }
const body = new X.Body({ height: 1.75 });
let cal = null, demo = null, pose = null, rec = null, view = { yaw: -0.6, pitch: 0.25, mode: 'free' };

// ---------- Bluetooth
$('add').onclick = async () => {
  if (!navigator.bluetooth) { alert('Този браузър няма Bluetooth. Отвори страницата в Chrome.'); return; }
  try {
    const dev = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: 'XEMS Motion' }], optionalServices: [DATA_SVC, NUS] });
    connect(dev);
  } catch (e) { /* chooser closed */ }
};
async function connect(dev, tries = 0) {
  const id = dev.name.replace('XEMS Motion ', '');
  const s = sensors[id] = sensors[id] || { name: dev.name, dev, n: 0, rate: 0, t0: performance.now() };
  s.state = 'свързване…'; drawSensors();
  try {
    const g = await dev.gatt.connect();
    const data = await (await g.getPrimaryService(DATA_SVC)).getCharacteristic(DATA_CHR);
    data.addEventListener('characteristicvaluechanged', (e) => onSample(id, X.decodeFrame(e.target.value, performance.now() / 1000)));
    await data.startNotifications();
    try {
      const nus = await g.getPrimaryService(NUS);
      s.rx = await nus.getCharacteristic(NUS_RX);
      const tx = await nus.getCharacteristic(NUS_TX);
      let buf = '';
      tx.addEventListener('characteristicvaluechanged', (e) => {
        buf += new TextDecoder().decode(e.target.value);
        let i; while ((i = buf.indexOf('\n')) >= 0) { onLine(id, buf.slice(0, i)); buf = buf.slice(i + 1); }
      });
      await tx.startNotifications();
      send(id, 'info');
    } catch (e) { /* text channel optional */ }
    s.state = 'на линия';
    dev.ongattserverdisconnected = () => { s.state = 'изгубен — свързвам отново'; drawSensors(); setTimeout(() => connect(dev), 1000); };
  } catch (e) {
    s.state = 'грешка'; if (tries < 3) setTimeout(() => connect(dev, tries + 1), 1500);
  }
  drawSensors(); $('cal').disabled = Object.keys(sensors).length < 1;
}
function send(id, line) { const s = sensors[id]; if (s && s.rx) s.rx.writeValue(new TextEncoder().encode(line + '\n')).catch(() => {}); }
function onLine(id, l) {
  const s = sensors[id], m = /bat=(-?\d+)/.exec(l) || /^BAT (-?\d+)/.exec(l);
  if (m) { s.bat = +m[1]; drawSensors(); }
}

// ---------- samples → calibration / body
function onSample(id, smp) {
  const s = sensors[id]; if (!s) return;
  s.last = smp; s.n++;
  if (cal) cal.feed(id, smp);
  body.feed(id, smp);
  // the back sensor paces the solver (all others: latest sample); before calibration any sensor does
  const backId = body.role && body.role.back;
  if (body.cal && (id === backId || !backId)) step(smp.t);
}
function step(t) {
  pose = body.solve(t);
  if (rec && pose) rec.push([t.toFixed(3), ...ANG.map(([k]) => (pose.A[k] || 0).toFixed(1)), pose.rep.count].join(','));
}

// ---------- demo: the scripted person of motion-core.js, live
$('demo').onclick = () => {
  if (demo) { clearInterval(demo.timer); for (const id in demo.rig) delete sensors[id]; demo = null; $('demo').textContent = 'Демо'; drawSensors(); return; }
  const rig = X.sim.makeRig(Math.floor(Math.random() * 1e6) + 1), dim = X.bodyDims(1.75);
  demo = { rig, t0: performance.now() / 1000, len: X.sim.scriptLength() };
  for (const id in rig) sensors[id] = { name: 'Демо ' + id, n: 0, state: 'демо', bat: 100 };
  demo.timer = setInterval(() => {
    const now = performance.now() / 1000;
    let t = now - demo.t0;
    if (t > demo.len) { demo.t0 = now - 10; t = 10; }      // loop over the exercises, keep the calibration
    for (const id in rig) { const s = X.sim.simSample(t, rig, id, dim); s.t = now; onSample(id, s); }
  }, 1000 / 50);
  $('demo').textContent = 'Спри демо'; $('cal').disabled = false; drawSensors();
  setTimeout(() => startCal(true), 300);
};

// ---------- calibration wizard: zero pose → slow squat with the arms forward
let wiz = null;
$('cal').onclick = () => startCal(false);
$('wcancel').onclick = () => { wiz = null; cal = null; $('wiz').style.display = 'none'; };
$('wok').onclick = () => { $('wiz').style.display = 'none'; wiz = null; };
function startCal(fromDemo) {
  if (demo && !fromDemo) demo.t0 = performance.now() / 1000;          // demo: replay its own calibration
  cal = new X.Calibration();
  wiz = { phase: 'stand', since: performance.now(), stillSince: 0, moved: false };
  $('wiz').style.display = 'flex'; $('wok').style.display = 'none'; $('wr').textContent = '';
  for (const id in sensors) send(id, 'led off');
}
function wizTick() {
  if (!wiz) return;
  const now = performance.now(), ids = Object.keys(sensors);
  const still = ids.every((id) => sensors[id].last && Math.hypot(...sensors[id].last.gyro) < 6);
  const moving = ids.some((id) => sensors[id].last && Math.hypot(...sensors[id].last.gyro) > 40);
  if (wiz.phase === 'stand') {
    wiz.stillSince = still ? wiz.stillSince || now : 0;
    const left = wiz.stillSince ? Math.max(0, 2.2 - (now - wiz.stillSince) / 1000) : 2.2;
    show(Math.ceil(left) || '✓', 'Застани изправен', 'Краката събрани, ръцете до тялото, дланите към бедрата. Не мърдай.');
    if (wiz.stillSince && left <= 0) { cal.standDone(); wiz.phase = 'move'; wiz.since = now; wiz.stillSince = 0; }
  } else if (wiz.phase === 'move') {
    show('↓↑', 'Клекни бавно с ръце напред', 'Вдигни ръцете напред, клекни наполовина и се изправи. Спри изправен.');
    if (moving) wiz.moved = true;
    wiz.stillSince = still && wiz.moved ? wiz.stillSince || now : 0;
    if ((wiz.stillSince && now - wiz.stillSince > 700) || now - wiz.since > 12000) finishCal();
  }
}
function finishCal() {
  const res = cal.finish(); cal = null; wiz.phase = 'done';
  body.calibrate(res);
  for (const id in res.assign) send(id, 'led ' + X.ROLE_LED[res.assign[id]] + ' blink');
  show(res.ok ? '✓' : '!', res.ok ? 'Готово — всички сензори са намерени' : 'Почти готово', 'Всеки сензор свети в цвета на мястото си.');
  $('wr').innerHTML = Object.entries(res.assign).map(([id, r]) => `<span style="color:${LEDCSS[X.ROLE_LED[r]]}">●</span> ${X.ROLE_BG[r]} — ${id}`).join('<br>') +
    (res.problems.length ? '<div class="bad">' + res.problems.join('<br>') + '</div>' : '');
  $('wok').style.display = ''; $('rec').disabled = false; drawSensors();
}
function show(n, t, p) { $('wn').textContent = n; $('wt').textContent = t; $('wp').textContent = p; }
const LEDCSS = { white: '#9aa3af', red: '#ff3b30', green: '#30b14c', magenta: '#d63af9', cyan: '#00b7c3' };

// ---------- recording
$('rec').onclick = () => {
  if (!rec) { rec = ['t,' + ANG.map(([k]) => k).join(',') + ',reps']; $('rec').textContent = '■ Спри запис'; return; }
  const blob = new Blob([rec.join('\n')], { type: 'text/csv' }), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'xems-motion-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.csv'; a.click();
  rec = null; $('rec').textContent = '● Запис';
};
$('theme').onclick = () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark'; };
document.querySelectorAll('#view button').forEach((b) => b.onclick = () => {
  view.mode = b.dataset.v; if (view.mode === 'front') { view.yaw = 0; view.pitch = 0.08; } if (view.mode === 'side') { view.yaw = -Math.PI / 2; view.pitch = 0.08; }
});

// ---------- panels
function drawSensors() {
  const role = {}; if (body.cal) for (const id in body.cal.assign) role[id] = body.cal.assign[id];
  $('sensors').innerHTML = Object.entries(sensors).map(([id, s]) => {
    const r = role[id], c = r ? LEDCSS[X.ROLE_LED[r]] : 'var(--mute)';
    return `<div class="sens"><span class="dot" style="background:${c}"></span><div><b>${r ? X.ROLE_BG[r] : s.name}</b><br><span class="sub">${s.state || ''}</span></div>` +
      `<span class="m">${s.bat != null ? s.bat + ' %' : ''}</span></div>`;
  }).join('') || '<div class="sub">Няма сензори. Натисни „＋ Сензор“ за всеки от петте или „Демо“.</div>';
}
const ANG = [['trunkLean', 'Наклон напред', ''], ['trunkSide', 'Наклон встрани', ''], ['trunkTwist', 'Завъртане', ''],
  ['lKnee', 'Коляно', 'l'], ['rKnee', 'Коляно', 'r'], ['lHip', 'Тазобедрена', 'l'], ['rHip', 'Тазобедрена', 'r'],
  ['lShElev', 'Рамо', 'l'], ['rShElev', 'Рамо', 'r'], ['lElbow', 'Лакът', 'l'], ['rElbow', 'Лакът', 'r']];
const KEYBG = { knees: 'клякане', lKnee: 'ляво коляно', rKnee: 'дясно коляно', elbows: 'сгъване на ръцете', lElbow: 'ляв лакът',
  rElbow: 'десен лакът', shoulders: 'вдигане на ръцете', lShoulder: 'лява ръка', rShoulder: 'дясна ръка', trunk: 'наклон', twist: 'завъртане' };
function drawPanels() {
  if (!pose) return;
  const sp = (k) => pose.V[k] != null ? Math.abs(pose.V[k]).toFixed(0) : '';
  $('tbl').innerHTML = ANG.map(([k, n, s]) => `<tr><td class="${s}">${n}${s ? (s === 'l' ? ' Л' : ' Д') : ''}</td><td class="v">${(pose.A[k] || 0).toFixed(0)}°</td></tr>`).join('') +
    `<tr><td>Скорост ръка Л / Д</td><td class="v">${sp('lHand') && (pose.V.lHand).toFixed(1)} / ${sp('rHand') && pose.V.rHand.toFixed(1)} m/s</td></tr>` +
    `<tr><td>Скорост коляно Л / Д</td><td class="v">${sp('lKnee')} / ${sp('rKnee')} °/s</td></tr>`;
  const r = pose.rep;
  $("rn").textContent = r.count;
  $('rk').textContent = r.key ? KEYBG[r.key] || r.key : 'повторения';
  $('rp').textContent = !r.key ? 'в покой' : r.phase === 'high' ? 'връщане' : 'движение';
  if (r.last && r.last.out > 0.1) $("rk").textContent += ` · ${r.last.rom.toFixed(0)}° · ${r.last.out.toFixed(1)} + ${r.last.back.toFixed(1)} s`;
}

// ---------- 3-D stick figure (no library: a rotating camera and a painter's sort)
const cv = $('cv'), ctx = cv.getContext('2d');
let drag = null;
cv.onpointerdown = (e) => { drag = { x: e.clientX, y: e.clientY, yaw: view.yaw, pitch: view.pitch }; cv.setPointerCapture(e.pointerId); };
cv.onpointermove = (e) => { if (!drag) return; view.mode = 'free'; view.yaw = drag.yaw + (e.clientX - drag.x) / 150; view.pitch = Math.max(-0.2, Math.min(1.2, drag.pitch + (e.clientY - drag.y) / 200)); };
cv.onpointerup = () => drag = null;
const BONES = [['pelvis', 'neck', 0], ['neck', 'head', 0], ['lhip', 'rhip', 0], ['lsh', 'rsh', 0],
  ['lhip', 'lknee', 'l'], ['lknee', 'lankle', 'l'], ['lankle', 'ltoe', 'l'], ['rhip', 'rknee', 'r'], ['rknee', 'rankle', 'r'], ['rankle', 'rtoe', 'r'],
  ['lsh', 'lelbow', 'l'], ['lelbow', 'lwrist', 'l'], ['lwrist', 'lhand', 'l'], ['rsh', 'relbow', 'r'], ['relbow', 'rwrist', 'r'], ['rwrist', 'rhand', 'r']];
function render() {
  const w = cv.clientWidth, h = cv.clientHeight, dpr = devicePixelRatio || 1;
  if (cv.width !== w * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
  const css = getComputedStyle(document.documentElement), C = (n) => css.getPropertyValue(n).trim();
  const J = pose ? pose.J : null;
  // camera: centre between the feet, the figure faces the viewer when the trunk turns
  const c0 = J ? [(J.lankle[0] + J.rankle[0]) / 2, (J.lankle[1] + J.rankle[1]) / 2, 0] : [0, 0, 0];
  const floor = J ? Math.min(J.lankle[2], J.rankle[2]) - body.dim.ankleH : 0;
  const yaw = view.yaw + (pose && body.faceForward ? -pose.yaw * Math.PI / 180 * 0 : 0);
  const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(view.pitch), sp = Math.sin(view.pitch);
  const S = Math.min(w, h) / 2.3;
  const P = (p) => {
    const x = p[0] - c0[0], y = p[1] - c0[1], z = p[2] - floor - 0.9;
    const X1 = -x * sy - y * cy, D = x * cy - y * sy;                 // camera looks along +x at yaw 0 (front view)
    const Y1 = z * cp - D * sp, Z1 = D * cp + z * sp;
    return [w / 2 + X1 * S, h * 0.52 - Y1 * S, Z1];
  };
  // floor grid
  ctx.strokeStyle = C('--floor'); ctx.lineWidth = 1;
  for (let i = -5; i <= 5; i++) {
    const a = P([c0[0] + i * 0.25, c0[1] - 1.25, floor]), b = P([c0[0] + i * 0.25, c0[1] + 1.25, floor]);
    const c = P([c0[0] - 1.25, c0[1] + i * 0.25, floor]), d = P([c0[0] + 1.25, c0[1] + i * 0.25, floor]);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.moveTo(c[0], c[1]); ctx.lineTo(d[0], d[1]); ctx.stroke();
  }
  if (!J) { ctx.fillStyle = C('--mute'); ctx.font = '15px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(Object.keys(sensors).length ? 'Калибрирай, за да се появи фигурата' : 'Свържи сензорите или пусни демо', w / 2, h / 2); return; }
  const segs = BONES.map(([a, b, s]) => { const A = P(J[a]), B = P(J[b]); return { A, B, s, z: (A[2] + B[2]) / 2 }; }).sort((u, v) => v.z - u.z);
  ctx.lineCap = 'round';
  for (const g of segs) {
    ctx.strokeStyle = g.s === 'l' ? C('--l') : g.s === 'r' ? C('--r') : C('--bone');
    ctx.lineWidth = Math.max(4, 11 - g.z * 3);
    ctx.beginPath(); ctx.moveTo(g.A[0], g.A[1]); ctx.lineTo(g.B[0], g.B[1]); ctx.stroke();
  }
  const H = P(J.head); ctx.fillStyle = C('--bone'); ctx.beginPath(); ctx.arc(H[0], H[1], S * 0.1, 0, 7); ctx.fill();
  // feet shadows show which foot carries the weight
  for (const s of ['l', 'r']) { const f = pose.feet[s]; const p = P([f.p[0], f.p[1], floor]);
    ctx.fillStyle = f.air ? 'transparent' : C('--floor'); ctx.beginPath(); ctx.ellipse(p[0], p[1], 14, 5, 0, 0, 7); ctx.fill(); }
}
function loop() { wizTick(); render(); drawPanels(); requestAnimationFrame(loop); }
drawSensors(); loop();
</script>
</body>
</html>
