name = "xems-license"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# The client card page (../branding/report/client-card.html) is bundled as text.
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[vars]
PUBLIC_URL = "https://license.biocode-bg.com"
# New tablets (no key) join this license with its modules until the admin locks them (Таблети → премахни).
OWNER_LICENSE = "L-2026-792848"

[[d1_databases]]
binding = "DB"
database_name = "xems-license"
database_id = "d5eb1f2e-57d8-49df-8d51-5e570f54bf6c"

# Full training records (create once: npx wrangler r2 bucket create xems-session-logs)
[[r2_buckets]]
binding = "LOGS"
bucket_name = "xems-session-logs"

[[routes]]
pattern = "license.biocode-bg.com/*"
zone_name = "biocode-bg.com"
