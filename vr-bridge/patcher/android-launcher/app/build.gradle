plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "eu.xems.vrlauncher"
    compileSdk 34

    defaultConfig {
        applicationId "eu.xems.vrlauncher"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
}

dependencies {
    // Plain android.app.Activity + Material theme: no AndroidX needed for a one-screen launcher.
    testImplementation "junit:junit:4.13.2"
}
