plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "eu.xems.vrlauncher"
    compileSdk 34

    defaultConfig {
        applicationId "eu.xems.vrlauncher"
        minSdk 24
        targetSdk 34
        versionCode 8
        versionName "1.5"
    }

    // termux/termux-setup.sh travels inside the APK; the app hands it to Termux (no typing in Termux).
    sourceSets { main { assets.srcDirs += ["../termux"] } }

    // A committed debug key: every build — CI, any PC, the prebuilt xems-vr-launcher.apk — installs over the last.
    signingConfigs {
        debug {
            storeFile file("../debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
}

dependencies {
    // Plain android.app.Activity + Material theme: no AndroidX needed for a one-screen launcher.
    testImplementation "junit:junit:4.13.2"
}
